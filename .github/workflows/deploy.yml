name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No permissions by default. Each job asks for exactly what it needs.
permissions: {}

# One run per branch at a time, and never cancel a deployment halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The API lives in the app/ folder, not at the repository root.
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build and push the image
    needs: test
    # Pull requests stop after the tests. Only main builds and deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job request an OIDC token; it grants nothing else
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Build and push, tagged with the commit SHA
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # Tags are immutable, so a re-run of the same commit must not push again.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "Image for $GITHUB_SHA is already in ECR. Nothing to build."
          else
            # The Dockerfile and its build context are in app/.
            docker build --provenance=false --build-arg APP_VERSION="$GITHUB_SHA" -t "$IMAGE" app
            docker push "$IMAGE"
          fi

  deploy:
    name: Deploy to ECS
    needs: build
    # Skipped until Phase 10, when you create the ECS_SERVICE variable.
    if: vars.ECS_SERVICE != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - name: Get temporary AWS credentials through OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download the task definition the service runs now
        run: |
          arn=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$arn" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.aws.outputs.aws-account-id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register the new revision and roll it out
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 20
          wait-max-delay-seconds: 15
